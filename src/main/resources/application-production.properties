spring.application.name=PizzaApp
server.port=8080

server.servlet.session.cookie.same-site=strict

# \u2705 MySQL Database Configuration (with Correct Syntax)
spring.datasource.url=jdbc:mysql://database-1.cnsoc2kia04g.eu-north-1.rds.amazonaws.com:3306/my_pizza_app?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=admin
spring.datasource.password=54321atManju
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# \u2705 Hibernate JPA Configuration (Fixed MySQL 8 Dialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# \u2705 Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# \u2705 Debugging & SQL Logs
logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
